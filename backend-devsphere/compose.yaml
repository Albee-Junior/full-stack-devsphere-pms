services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: devsphere
      POSTGRES_USER: devsphere
      POSTGRES_PASSWORD: devsphere_local
    ports:
      - "5432:5432"
    volumes:
      - devsphere-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devsphere -d devsphere"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  devsphere-postgres:
